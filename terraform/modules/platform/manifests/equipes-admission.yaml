# ---------------------------------------------------------------------------
# Services des namespaces d'équipe (label agentic.io/team), pour TOUS les
# auteurs : pipeline de l'équipe, agentregistry, kagent, administrateur.
# Un Service d'équipe sélectionne SES pods, en ClusterIP, rien d'autre :
#   - ExternalName ou un Service sans sélecteur ferait relayer par la passerelle
#     (backend mcp-equipes, découverte par label) un service de la plateforme
#     — Azure MCP, modèle KAITO, contrôleur kagent — en contournant leurs
#     NetworkPolicies, puisque la passerelle y est autorisée ;
#   - LoadBalancer ou NodePort publierait un serveur MCP sans authentification
#     hors du cluster ; externalIPs détournerait le trafic d'une adresse.
# ---------------------------------------------------------------------------
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: equipes-services
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: agentic.io/team, operator: Exists }
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "Service d'équipe : ClusterIP seulement (ni ExternalName, ni LoadBalancer, ni NodePort)"
    - expression: "has(object.spec.selector) && size(object.spec.selector) > 0"
      message: "Service d'équipe : un sélecteur de pods est obligatoire"
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "Service d'équipe : externalIPs interdit"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: equipes-services
spec:
  policyName: equipes-services
  validationActions: [Deny]
