apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: __EQUIPE__
# Pas de NetworkPolicy ici : celles du namespace (entrées du serveur MCP, sorties
# de tous les pods) sont posées par Agent Ready (terraform/teams) et le pipeline
# de l'équipe ne peut que les lire.
resources:
  - serviceaccount.yaml
  - docs-mcp.yaml
  - remotemcpserver.yaml
images:
  - name: docs-mcp
    newName: __ACR__/__EQUIPE__/docs-mcp
    # « latest » n'est qu'une valeur par défaut du gabarit : le workflow de
    # l'équipe la remplace par le SHA du commit (kustomize edit set image)
    # avant d'appliquer. Ne jamais déployer ce fichier tel quel.
    newTag: latest
