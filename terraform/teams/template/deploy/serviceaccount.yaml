# L'identité managée de l'équipe, pour ce ServiceAccount précis : la
# fédération créée par « Agent Ready » (id-__EQUIPE__-mcp) porte le sujet
# system:serviceaccount:__EQUIPE__:docs-mcp. Aucun secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docs-mcp
  annotations:
    azure.workload.identity/client-id: __CLIENT_ID__
    azure.workload.identity/tenant-id: __TENANT_ID__
