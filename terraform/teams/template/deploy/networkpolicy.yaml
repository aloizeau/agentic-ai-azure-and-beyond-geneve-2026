# Le serveur MCP n'est joignable que par l'agent de l'équipe (même namespace),
# par la passerelle et par le contrôleur kagent (qui lit la liste des outils).
# Le reste du cluster ne le voit pas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-mcp-entrees
spec:
  podSelector:
    matchLabels: { app: docs-mcp }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
      ports:
        - { port: 8080, protocol: TCP }
