# ---------------------------------------------------------------------------
# Who may call, how much, with which rules — attached to routes, not to
# providers, so they hold for Foundry, a self-hosted model or anything else.
# Validated against the agentgateway v1.5.0 CRD schema (including CEL rules).
# ---------------------------------------------------------------------------

# People (LibreChat): a valid Entra ID v2 access token, or nothing (démo A : 401).
# Same rule for the models (/v1) and for the tools (/mcp).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: acces-llm
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-web }           # recherche web (DuckDuckGo)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-equipes }       # outils publiés par les équipes (démo B)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-grafana }       # outils d'entreprise (option)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-azure }         # outils d'entreprise (option)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-graph }         # outils d'entreprise (option)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-public }       # gateway/public, optional
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://login.microsoftonline.com/TENANT_ID/v2.0
          audiences: [GATEWAY_API_CLIENT_ID]      # v2 tokens: aud = client-ID GUID
          jwks:
            remote:
              url: https://login.microsoftonline.com/TENANT_ID/discovery/v2.0/keys
    rateLimit:
      local:
        - tokens: 50000                           # ceiling per route (démo A : 429)
          unit: Minutes
---
# Agents: one virtual key per team (Secrets labelled agentic.io/virtual-key,
# created by Terraform from var.teams). The key metadata carries the team name.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: acces-agents
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents-public } # gateway/public, optional
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          agentic.io/virtual-key: "true"
    rateLimit:
      local:
        - tokens: 50000
          unit: Minutes
---
# Content rules — the same on every LLM route, whatever the provider.
# When NeMo Guardrails is enabled (guardrails/, R&D), Terraform removes this
# object and guardrails/ applies a policy of the same name with regex + webhook.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: garde-fous-llm
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-aks }          # models/, optional
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-aks-agents }   # models/, optional
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-public }       # gateway/public, optional
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents-public } # gateway/public, optional
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Reject
              builtins: [CreditCard]
            response:
              message: "Requête bloquée : donnée de carte bancaire détectée."
---
# Failover (démo bascule, deck Chalet): a provider answering 404/429/5xx is evicted and the next
# group serves; one retry lets the failing request itself land on the fallback.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-resilience
spec:
  targetRefs:
    - { group: agentgateway.dev, kind: AgentgatewayBackend, name: llm }
  backend:
    health:
      unhealthyCondition: "response.code == 404 || response.code == 429 || response.code >= 500"
      eviction:
        consecutiveFailures: 1
        duration: 60s
        restoreHealth: 100
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-retry-tracabilite
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-public }       # gateway/public, optional
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents-public } # gateway/public, optional
  traffic:
    retry:
      attempts: 1
      codes: [404, 429, 500, 502, 503]
    # Which model actually answered — visible with curl -i during the failover demo (Chalet deck).
    transformation:
      response:
        add:
          - name: x-served-model
            value: 'default(llm.responseModel, "unknown")'
