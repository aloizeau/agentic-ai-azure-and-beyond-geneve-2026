# ---------------------------------------------------------------------------
# Quels outils MCP les PERSONNES (LibreChat, jeton Entra ID) peuvent appeler.
# Le jeton prouve « qui » (acces-outils, policies.yaml) ; ces listes blanches
# disent « quoi ». Un outil hors liste disparaît du tools/list et son appel est
# refusé par la passerelle : un outil ajouté plus tard par une équipe reste
# fermé tant que la plateforme ne l'a pas ouvert (liste blanche, pas noire).
# Expressions CEL en OU (même forme que demos/D-agent-ops/plateforme).
#
# Étape suivante, documentée et non faite ici : restreindre PAR ÉQUIPE (seuls
# les membres de l'équipe X voient les outils et agents de X). Il faut pour cela
# un claim de groupes Entra ID dans le jeton (groups ou roles, configuré sur
# l'application API) puis une règle du type
#   mcp.tool.name.startsWith("<cible de X>_") && "<id groupe X>" in jwt.groups
# (nom de cible COMPLET suivi de « _ » : un simple préfixe « x- » couvrirait
# aussi une équipe « x-y »).
# Sans ce claim, la passerelle ne sait pas à quelle équipe appartient un humain.
# ---------------------------------------------------------------------------
# /mcp — le contrôleur kagent : lister les agents, et n'en interroger que
# certains. invoke_agent ouvert à tout agent = tout le tenant (LibreChat) pilote
# n'importe quel agent du cluster avec SES droits : equipe-ops/assistant-ops
# (Reader Azure, tickets GitHub), ou les agents intégrés du chart kagent
# (namespace kagent, outils Kubernetes en écriture). La liste ci-dessous est
# celle des agents PUBLIÉS aux personnes, au format « <namespace>/<nom> »
# (argument agent d'invoke_agent, comme metrics.yaml et demos/B-agent-equipe).
# Critère : un agent n'y entre que si ses outils n'ouvrent rien de plus que ce
# que les personnes ont déjà (ex. assistant-docs : lecture des documents de son
# équipe, déjà lisibles sur /mcp-equipes). Les agents à identité privilégiée
# (Azure, écriture) restent dans l'UI kagent, réservée à l'équipe IA.
# Publier un agent : ajouter "<namespace>/<nom>" à la liste, par PR sur ce
# fichier (revue de l'équipe IA) — jamais de joker ni de startsWith.
# Tout autre outil du serveur kagent (création, suppression…) reste fermé.
# VÉRIFIER (D-7) : kagent 0.10 — nom de l'argument (agent) et forme
# « namespace/nom » ; dans tools/list, mcp.tool.arguments est absent : la
# branche !has(...) garde invoke_agent visible (un appel sans argument agent
# est refusé par kagent lui-même).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: outils-agents-autorises
spec:
  targetRefs:
    - { group: agentgateway.dev, kind: AgentgatewayBackend, name: mcp }
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            # Une seule cible (agents) : pas de préfixe par défaut ; la forme
            # préfixée agents_* est listée au cas où prefixMode passerait à Always.
            - 'mcp.tool.name in ["list_agents", "agents_list_agents"]'
            - >-
              mcp.tool.name in ["invoke_agent", "agents_invoke_agent"] &&
              (!has(mcp.tool.arguments) || !has(mcp.tool.arguments.agent) ||
              mcp.tool.arguments.agent in ["equipe-docs/assistant-docs"])
---
# /mcp-equipes — outils publiés par les équipes, préfixés par la cible
# (prefixMode Always : <cible>_rechercher ; la cible, annotation
# agentgateway.dev/mcp-target-name, commence par le namespace de l'équipe —
# règle d'admission Agent Ready). Seul le SUFFIXE compte ici, la cible n'est
# donc pas supposée. LECTURE SEULE pour les
# personnes : créer ou commenter un ticket (ou tout outil d'écriture qu'une
# équipe ajouterait) reste un geste de l'agent, avec approbation humaine dans
# kagent — jamais un bouton ouvert à tout le tenant.
# Les suffixes protègent contre l'ERREUR, pas contre la malveillance : le nom
# d'un outil est choisi par l'équipe dans son serveur. Une équipe qui nomme un
# outil d'écriture « x_rechercher » le verra ouvert (risque accepté et
# documenté ; la revue du dépôt d'équipe et l'admission — nom de cible préfixé
# par le namespace — bornent l'impact à SES propres données).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: outils-equipes-autorises
spec:
  targetRefs:
    - { group: agentgateway.dev, kind: AgentgatewayBackend, name: mcp-equipes }
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'mcp.tool.name.endsWith("_lister_documents")'
            - 'mcp.tool.name.endsWith("_lire_document")'
            - 'mcp.tool.name.endsWith("_rechercher")'
            - 'mcp.tool.name.endsWith("_lister_tickets")'
