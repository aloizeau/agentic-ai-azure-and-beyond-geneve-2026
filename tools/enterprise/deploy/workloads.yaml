# Serveurs MCP d'entreprise auto-hébergés, atteints uniquement par la gateway.
# Chacun sert en streamable-http sur :9000 (chemin /mcp). Secrets créés hors
# dépôt par run.sh. Les images/flags marqués « VÉRIFIER » sont à confirmer et
# épingler (digest) à la répétition D-7 — même exigence que jira/duckduckgo.
# ---------------------------------------------------------------------------
# Grafana — « visualiser mes propres dashboards / métriques » depuis le chat.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: outils-entreprise
  labels: { app: mcp-grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-grafana } }
  template:
    metadata:
      labels: { app: mcp-grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          # VÉRIFIER (D-7) : tag non résolu depuis l'environnement de revue (Docker Hub
          # injoignable). Image officielle : grafana/mcp-grafana ; épingler une
          # version exacte (vX.Y.Z) puis un digest — jamais latest le jour J.
          image: mcp/grafana:latest
          # --disable-write : lecture seule (pas de création/modification de
          # dashboards, pas de SQL brut). --allowed-hosts : le Host reçu derrière
          # la passerelle est le nom du Service (sinon 403 par défaut).
          args:
            - "-t"
            - "streamable-http"
            - "-address"
            - "0.0.0.0:9000"
            - "--disable-write"
            - "--allowed-hosts"
            - "mcp-grafana.outils-entreprise.svc.cluster.local:9000,mcp-grafana.outils-entreprise.svc.cluster.local"   # VÉRIFIER le Host envoyé par la passerelle
          envFrom:
            - secretRef: { name: grafana-mcp-credentials }   # GRAFANA_URL, GRAFANA_API_KEY
          ports: [{ containerPort: 9000 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-grafana
  namespace: outils-entreprise
  labels: { app: mcp-grafana }
spec:
  selector: { app: mcp-grafana }
  ports: [{ port: 9000, targetPort: 9000 }]
---
# Azure — « visualiser mes ressources Azure » (Resource Graph, AKS, coûts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-azure
  namespace: outils-entreprise
  labels: { app: mcp-azure }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-azure } }
  template:
    metadata:
      labels: { app: mcp-azure }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          image: node:22-bookworm-slim       # VÉRIFIER, puis épingler un digest
          command: ["npx"]
          # Version exacte (npm view @azure/mcp version, 2026-10-13) : jamais
          # @latest, un dépôt public ne doit pas exécuter ce qui sort demain.
          # VÉRIFIER (D-7) : 3.0.0 est une majeure publiée la veille de l'audit ;
          # la doc (azmcp-commands.md) donne --transport stdio|http (pas
          # « streamable-http »), pas d'option --port (ASPNETCORE_URLS), HTTP
          # réservé à certaines builds et auth entrante obligatoire sauf
          # --dangerously-disable-http-incoming-auth. Variante éprouvée :
          # image mcr.microsoft.com/azure-sdk/azure-mcp (demos/D-agent-ops).
          # --read-only + 4 domaines seulement : on « visualise » Azure, on ne le
          # modifie pas, quel que soit le rôle du principal de service.
          args:
            - "-y"
            - "@azure/mcp@3.0.0"
            - "server"
            - "start"
            - "--transport"
            - "streamable-http"
            - "--port"
            - "9000"
            - "--read-only"
            - "--mode"
            - "namespace"
            - "--namespace"
            - "aks"
            - "--namespace"
            - "group"
            - "--namespace"
            - "monitor"
            - "--namespace"
            - "resourcehealth"
          env:
            - { name: HOME, value: /tmp }
            - { name: npm_config_cache, value: /tmp/.npm }
          envFrom:
            - secretRef: { name: azure-mcp-credentials }     # AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (préférer Workload Identity)
          ports: [{ containerPort: 9000 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 15            # npx installe le paquet au 1er démarrage
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-azure
  namespace: outils-entreprise
  labels: { app: mcp-azure }
spec:
  selector: { app: mcp-azure }
  ports: [{ port: 9000, targetPort: 9000 }]
---
# Microsoft Graph / M365 — « visualiser SharePoint / OneDrive / Teams ».
#
# ⚠️ ATTENTION — À LAISSER DÉSACTIVÉ dans le dépôt public (enable_enterprise_tools).
# Identifiants app-only (secret + consentement admin) : CHAQUE utilisateur
# LibreChat voit tout ce que l'APPLICATION voit — tous les sites SharePoint,
# OneDrive, équipes du tenant autorisés à l'app — sans tenir compte de ses
# propres droits. La passerelle authentifie la personne, mais Graph ne voit que
# l'app. À n'activer qu'avec des permissions Sites.Selected (sites listés
# explicitement) ou en délégué / On-Behalf-Of (--obo), jamais Sites.Read.All.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-graph
  namespace: outils-entreprise
  labels: { app: mcp-graph }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-graph } }
  template:
    metadata:
      labels: { app: mcp-graph }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          image: node:22-bookworm-slim       # VÉRIFIER, puis épingler un digest
          command: ["npx"]
          # Version exacte (npm view @softeria/ms-365-mcp-server version, 2026-10-13).
          # --read-only : outils de lecture seulement (pas d'envoi, pas d'écriture).
          # VÉRIFIER (D-7) : en --http le serveur attend un jeton OAuth par requête
          # (README) ; vérifier la cohabitation avec les identifiants app-only.
          args: ["-y", "@softeria/ms-365-mcp-server@0.162.0", "--http", "9000", "--read-only"]
          env:
            - { name: HOME, value: /tmp }
            - { name: npm_config_cache, value: /tmp/.npm }
          envFrom:
            - secretRef: { name: graph-mcp-credentials }     # MS365_MCP_CLIENT_ID / TENANT_ID / CLIENT_SECRET (app Entra + consentement admin)
          ports: [{ containerPort: 9000 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-graph
  namespace: outils-entreprise
  labels: { app: mcp-graph }
spec:
  selector: { app: mcp-graph }
  ports: [{ port: 9000, targetPort: 9000 }]
