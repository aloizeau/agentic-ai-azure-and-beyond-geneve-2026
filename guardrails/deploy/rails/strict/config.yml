# Ces regex sont une première ligne de défense, pas un DLP : elles arrêtent
# les fuites évidentes (copier-coller), pas un attaquant qui encode ou
# découpe la donnée. Syntaxe : module Python `re` (search), `(?i)` en tête
# plutôt que `case_insensitive` pour rester portable vers le microservice.
# Séparateurs tolérés : espace, point, tiret ([\s.\-]). L'adaptateur
# normalise le texte avant de l'envoyer ici (NFKC, caractères de largeur
# nulle supprimés) : chiffres pleine largeur et U+200B ne contournent rien.
# Garder default/ et strict/ identiques.
#
# Ce qui n'est PAS ici, mais dans l'adaptateur (adapter/app/dlp.py) :
#   - cartes bancaires : une regex ne sait pas vérifier la clé de Luhn, et
#     l'ancien motif bloquait versions, IP, dates, téléphones, SIRET ;
#   - messages `tool` : par défaut (TOOL_RAILS=secrets), seuls les 5 motifs
#     « secrets » ci-dessous leur sont appliqués (copie Python, égalité
#     vérifiée par un test), pas les motifs de données personnelles ni le
#     self check LLM.

# Profile "strict" — "default" + semantic LLM self-checks (jailbreak, policy).
# The self-check model is called through the INTERNAL agentgateway listener,
# which has no guardrail policy attached (otherwise: infinite loop) but is
# still metered, so the cost of guardrails shows up in Grafana.
models:
  - type: main
    engine: openai
    model: gpt-56-terra-eu           # Foundry deployment name (DataZoneStandard)
    parameters:
      base_url: http://agentgateway-internal.agentgateway-system.svc.cluster.local:8080/v1
      api_key: unused                # the gateway authenticates to Foundry (workload identity)
      temperature: 0

rails:
  config:
    regex_detection:
      input:
        patterns:
          # Secrets pasted into prompts — the 60 000 € weekend started with a key.
          - '(?i)\bsk-(?:proj-|ant-)?[a-z0-9_-]{20,}'                                  # OpenAI / Anthropic-style keys
          - '(?i)\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'                                       # AWS access key id
          - '(?i)\b(?:gh[pousr]_[a-z0-9]{36,}|github_pat_[a-z0-9_]{22,})'              # GitHub tokens
          - '(?i)-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
          # `clé: valeur` — valeur ≥ 8 car., avec un chiffre ou un symbole, pas un renvoi
          # ($VAR, <…>, {…}, ****) : « mot de passe: introuvable » n'est pas un secret.
          - '(?i)\b(?:api[_-]?key|access[_-]?key|account[_-]?key|client[_-]?secret|secret|token|password|passwd|pwd|mot de passe|mdp)\s*[:=]\s*["'']?(?![$%<{\[*])(?=[^\s"'']*?[0-9@#%^&+=/\\|~_])[^\s"'']{8,}'
          # Personal data
          - '(?i)\bFR[\s.\-]?\d{2}(?:[\s.\-]?[0-9a-z]{4}){5}[\s.\-]?[0-9a-z]{3}\b'     # French IBAN
          # French NIR, clé (2 chiffres) obligatoire : sans elle, un horodatage en ms
          # (« 1760342400123 ») avait exactement la forme d'un NIR.
          - '(?i)\b[12][\s.\-]?\d{2}[\s.\-]?(?:0[1-9]|1[0-2])[\s.\-]?(?:\d{2}|2[ab])[\s.\-]?\d{3}[\s.\-]?\d{3}[\s.\-]?\d{2}\b'
      output:
        patterns:
          - '(?i)\bsk-(?:proj-|ant-)?[a-z0-9_-]{20,}'
          - '(?i)\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
          - '(?i)\b(?:gh[pousr]_[a-z0-9]{36,}|github_pat_[a-z0-9_]{22,})'
          - '(?i)-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
    injection_detection:
      injections: [code, sqli, template, xss]
      action: reject
  input:
    flows:
      - regex check input        # cheap checks first: no LLM call if they block
      - self check input
  output:
    flows:
      - regex check output
      - injection detection
      - self check output
