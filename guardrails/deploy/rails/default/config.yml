# Ces regex sont une première ligne de défense, pas un DLP : elles arrêtent
# les fuites évidentes (copier-coller), pas un attaquant qui encode ou
# découpe la donnée. Syntaxe : module Python `re` (search), `(?i)` en tête
# plutôt que `case_insensitive` pour rester portable vers le microservice.
# Séparateurs tolérés : espace, point, tiret ([\s.\-]).
# Garder default/ et strict/ identiques.

# Profile "default" — deterministic rails only: no LLM call, sub-10 ms, CPU.
# Same file works with the NeMo Guardrails library AND the NVIDIA microservice
# (NVIDIA: "Configurations are portable between the library and microservice").
rails:
  config:
    regex_detection:
      input:
        patterns:
          # Secrets pasted into prompts — the 60 000 € weekend started with a key.
          - '(?i)\bsk-(?:proj-|ant-)?[a-z0-9_-]{20,}'                                  # OpenAI / Anthropic-style keys
          - '(?i)\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'                                       # AWS access key id
          - '(?i)\b(?:gh[pousr]_[a-z0-9]{36,}|github_pat_[a-z0-9_]{22,})'              # GitHub tokens
          - '(?i)-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
          - '(?i)\b(?:api[_-]?key|access[_-]?key|account[_-]?key|client[_-]?secret|secret|token|password|passwd|pwd|mot de passe|mdp)\s*[:=]\s*["'']?[^\s"'']{8,}'
          # Personal data
          - '\b(?:\d[\s.\-]?){12,15}\d\b'                                              # payment card numbers (13-16 digits)
          - '(?i)\bFR[\s.\-]?\d{2}(?:[\s.\-]?[0-9a-z]{4}){5}[\s.\-]?[0-9a-z]{3}\b'     # French IBAN
          - '(?i)\b[12][\s.\-]?\d{2}[\s.\-]?(?:0[1-9]|1[0-2])[\s.\-]?(?:\d{2}|2[ab])[\s.\-]?\d{3}[\s.\-]?\d{3}(?:[\s.\-]?\d{2})?\b'  # French NIR
      output:
        patterns:
          - '(?i)\bsk-(?:proj-|ant-)?[a-z0-9_-]{20,}'
          - '(?i)\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
          - '(?i)\b(?:gh[pousr]_[a-z0-9]{36,}|github_pat_[a-z0-9_]{22,})'
          - '(?i)-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
    injection_detection:
      # YARA rules shipped with NeMo Guardrails. Checks what the model returns,
      # which matters when an agent's output becomes a tool input.
      injections: [code, sqli, template, xss]
      action: reject
  input:
    flows:
      - regex check input
  output:
    flows:
      - regex check output
      - injection detection
