# ---------------------------------------------------------------------------
# Two layers, one policy object per route.
#
#   Layer 1 — native agentgateway guard (regex): microseconds, no dependency.
#   Layer 2 — webhook to the NeMo Guardrails adapter: semantic + YARA rails.
#
# The rules are the same whichever model provider the route ends up on
# (Foundry, Bedrock, OVHcloud…): they live at the gateway, not at the provider.
# ---------------------------------------------------------------------------
#
# Same NAME as the regex-only policy of gateway/deploy/policies.yaml: when NeMo
# is enabled, Terraform drops that one and this object takes its place, so one
# policy object carries the content rules of every LLM route.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: garde-fous-llm
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm }          # people (LibreChat)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents }   # agents (kagent)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-aks }          # self-hosted model (optional):
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-aks-agents }   # no Foundry filter there
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-public }         # public exposure (optional)
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-agents-public }  # gateway/public
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Reject
              builtins: [CreditCard]
            response:
              message: "Requête bloquée : donnée de carte bancaire détectée."
          - webhook:
              backendRef:
                kind: Service
                name: guardrail-adapter
                port: 8080
              failureMode: FailClosed         # adapter unreachable => reject (documented default)
              headers:
                x-guardrail-profile: '"default"'   # CEL string literal: rail profile for this route
                x-user: jwt.sub                    # identity for the adapter's logs
                x-model: llmRequest.model
                # Équipe de l'agent (clé virtuelle) ou « collaborateurs » (personnes) : même
                # expression que gateway/deploy/metrics.yaml. Libellé `team` du dashboard
                # « Garde-fous ». VÉRIFIER (D-7) : apiKey est-il évalué dans les en-têtes du webhook ?
                x-team: 'default(apiKey.team, "collaborateurs")'
        response:
          - webhook:
              backendRef:
                kind: Service
                name: guardrail-adapter
                port: 8080
              failureMode: FailClosed
              headers:
                x-guardrail-profile: '"default"'
                x-user: jwt.sub
                x-team: 'default(apiKey.team, "collaborateurs")'   # VÉRIFIER (D-7), comme sur /request
---
# A stricter profile for a route exposed to broader audiences (e.g. the
# company-wide assistant): same adapter, "strict" rails incl. LLM self-checks.
#
# ⚠️ EXEMPLE INERTE : aucune HTTPRoute `llm-assistant-groupe` n'existe dans ce
# dépôt (routes LLM réelles : llm, llm-agents, llm-aks*, llm-*-public). Tant
# qu'elle n'est pas créée, cette policy ne s'attache à rien et AUCUNE route ne
# passe par le profil strict. Pour passer une route existante en strict, ne
# pas l'ajouter ici (elle serait aussi ciblée par garde-fous-llm) : la retirer
# de garde-fous-llm ou y changer `x-guardrail-profile` en '"strict"'.
# Penser alors au timeout de 3 s ci-dessous : le self check LLM y tient-il
# sous charge ? VÉRIFIER (D-7).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: guardrails-strict
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-assistant-groupe
  backend:
    ai:
      promptGuard:
        request:
          - webhook:
              backendRef: { kind: Service, name: guardrail-adapter, port: 8080 }
              failureMode: FailClosed
              headers:
                x-guardrail-profile: '"strict"'
                x-user: jwt.sub
                x-team: 'default(apiKey.team, "collaborateurs")'
        response:
          - webhook:
              backendRef: { kind: Service, name: guardrail-adapter, port: 8080 }
              failureMode: FailClosed
              headers:
                x-guardrail-profile: '"strict"'
                x-user: jwt.sub
                x-team: 'default(apiKey.team, "collaborateurs")'
---
# The webhook has no deadline of its own: without this, a slow engine stalls
# every LLM call. On expiry the webhook counts as unavailable => failureMode.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: guardrail-adapter-timeout
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: guardrail-adapter
  backend:
    http:
      requestTimeout: 3s
