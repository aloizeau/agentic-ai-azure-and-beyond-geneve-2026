# Point de départ de la démo A : une route ouverte « pour aller vite ».
# Même backend que la plateforme (llm, Microsoft Foundry), aucune politique :
# n'importe qui sur le réseau peut consommer, sans limite. C'est l'histoire du
# week-end à 60 000 €, avec une clé qui fuit à la place de cette route.
# Validé contre le schéma Gateway API v1 / agentgateway v1.5.0.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-demo-ouverte
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: demo-a
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path: { type: PathPrefix, value: /demo/v1 }
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm
      timeouts:
        request: 120s
