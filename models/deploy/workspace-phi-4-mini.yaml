# ---------------------------------------------------------------------------
# A model served INSIDE the cluster, by the AKS AI toolchain operator add-on
# (KAITO, CNCF Sandbox). One Workspace = GPU node provisioned on demand +
# vLLM + an OpenAI-compatible endpoint (Service "workspace-phi-4-mini", port 80).
#
# Preset: microsoft/Phi-4-mini-instruct (MIT). Tool calling enabled so kagent
# agents can use it — same ConfigMap as the upstream example
# examples/inference/kaito_workspace_tool_calling.yaml.
#
# instanceType: 1x NVIDIA A10 (24 GB) is enough for a 3.8B model; the upstream
# example uses an A100. Patched by Terraform from var.self_hosted_gpu_instance_type.
# KAITO requires Ampere or newer (compute capability >= 8.0): no T4/V100.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: phi-4-mini-inference-params
  namespace: models
data:
  inference_config.yaml: |
    max_probe_steps: 6
    vllm:
      cpu-offload-gb: 0
      swap-space: 4
      max-model-len: 8192
      # ref: https://docs.vllm.ai/en/latest/features/tool_calling.html
      tool-call-parser: phi4_mini_json
      chat-template: "/workspace/chat_templates/tool-chat-phi4-mini.jinja"
---
apiVersion: kaito.sh/v1beta1
kind: Workspace
metadata:
  name: workspace-phi-4-mini
  namespace: models
resource:
  instanceType: "Standard_NV36ads_A10_v5"
  labelSelector:
    matchLabels:
      apps: phi-4-mini
inference:
  preset:
    name: microsoft/Phi-4-mini-instruct
  config: phi-4-mini-inference-params
